<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>HTML Assignment 3</title>
	<style>
		table.middle {
  border: 1px solid black;
  border-spacing: 1px;
  border-collapse: separate;
  margin-left: 500px;
  margin-top: 30px;
}

table.middle td, table.middle th {
  border: 1px solid black;
  padding: 1px;
}

.center {
  text-align: center;
}

.right {
  text-align: right;
}

.green {

}

.blue {

}

</head>

	<table id="table-2" class="middle">

			<td>data</td>

	<table id="table-3" class="middle">
